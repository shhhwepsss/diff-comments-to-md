<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>local-review</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">local-review</span>
        <nav class="tabs">
          <a id="tab-local" class="tab" href="#/local">Папка</a>
          <a id="tab-pr" class="tab" href="#/pr">GitHub PR</a>
        </nav>
        <span id="repo-root" class="muted" title=""></span>
      </div>

      <div class="topbar-mid" id="topbar-mid">
        <div class="modes" id="modes">
          <button class="mode" data-mode="working" type="button">рабочая копия</button>
          <button class="mode" data-mode="staged" type="button">staged</button>
          <button class="mode" data-mode="base" type="button">base</button>
        </div>
        <input id="base-input" class="base-input" type="text" spellcheck="false" />
        <button id="reload" class="btn ghost" type="button" title="Перечитать дифф">↻</button>
      </div>

      <div class="topbar-right">
        <span id="comment-total" class="badge">0</span>
        <button id="copy-all" class="btn" type="button">Скопировать всё</button>
        <button id="export-md" class="btn" type="button">Сгенерировать .md</button>
        <button id="clear-all" class="btn danger" type="button">Очистить всё</button>
      </div>
    </header>

    <section id="screen-diff" class="screen" hidden>
      <div id="pr-header" class="pr-header" hidden></div>
      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-head">
            <span id="range-label" class="muted"></span>
          </div>
          <ul id="file-list" class="file-list"></ul>
        </aside>

        <section class="content">
          <div id="file-header" class="file-header"></div>
          <div id="diff" class="diff"></div>
        </section>
      </main>
    </section>

    <section id="screen-local" class="screen picker" hidden>
      <h1 class="picker-title">Локальная папка</h1>
      <p class="picker-hint">
        Выбери корень git-репозитория. Клик по строке — зайти внутрь, «открыть» — открыть эту
        папку.
      </p>

      <div class="picker-bar">
        <button id="local-up" class="btn ghost" type="button" hidden>↑ вверх</button>
        <span id="local-path" class="picker-path"></span>
      </div>

      <div id="local-error" class="picker-error" hidden></div>

      <ul id="local-entries" class="browse-list"></ul>

      <h2 class="picker-sub">Недавние</h2>
      <ul id="local-recent" class="browse-list"></ul>

      <div class="picker-manual">
        <input
          id="local-manual"
          class="text-input"
          type="text"
          spellcheck="false"
          placeholder="Или вставь путь целиком"
        />
        <button id="local-open" class="btn" type="button">Открыть</button>
      </div>
    </section>

    <section id="screen-pr" class="screen picker" hidden>
      <h1 class="picker-title">GitHub PR</h1>
      <div id="gh-status" class="gh-status"></div>

      <div class="pr-form">
        <input
          id="pr-repo"
          class="text-input"
          type="text"
          spellcheck="false"
          placeholder="owner/repo — необязательно"
        />
        <input
          id="pr-query"
          class="text-input"
          type="text"
          spellcheck="false"
          placeholder="поисковый запрос"
        />
        <select id="pr-state" class="text-input">
          <option value="open">open</option>
          <option value="closed">closed</option>
          <option value="merged">merged</option>
          <option value="all">все</option>
        </select>
        <button id="pr-search-btn" class="btn" type="button">Искать</button>
      </div>

      <ul id="pr-results" class="pr-results"></ul>
      <div id="pr-config-line" class="muted picker-hint"></div>
    </section>

    <div id="modal-overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Очистить все комментарии?</h2>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn" type="button">Отмена</button>
          <button id="modal-confirm" class="btn danger" type="button">Удалить</button>
        </div>
      </div>
    </div>

    <div id="root-modal-overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="root-modal-title">
        <h2 id="root-modal-title">Открыть корень репозитория?</h2>
        <p id="root-modal-text"></p>
        <div class="modal-actions">
          <button id="root-modal-cancel" class="btn" type="button">Отмена</button>
          <button id="root-modal-confirm" class="btn" type="button">Открыть корень</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/api.js"></script>
    <script src="/diff-view.js"></script>
    <script src="/screen-local.js"></script>
    <script src="/screen-pr.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
